# ============================================================
# 1. Namespace (Project)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# ============================================================
# 2. ConfigMap — Application configuration (non-sensitive)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: demo
data:
  APP_ENV: "production"
  APP_COLOR: "red"
  APP_MESSAGE: "Hello OpenShift CRC! 🚀"
  ROUTE_URL: "http://demo-app-demo.apps-crc.testing"
---
# ============================================================
# 3. Secret — Sensitive data (base64 encoded)
#    echo -n "adminuser" | base64   → YWRtaW51c2Vy
#    echo -n "S3cur3P@ss!" | base64 → UzNjdXIzUEBzcyE=
#    echo -n "myapikey123" | base64 → bXlhcGlrZXkxMjM=
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secret
  namespace: demo
type: Opaque
data:
  DB_USER: YWRtaW51c2Vy
  DB_PASSWORD: UzNjdXIzUEBzcyE=
  API_KEY: bXlhcGlrZXkxMjM=
---
# ============================================================
# 4. PersistentVolumeClaim — Dynamic storage request
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-app-pvc
  namespace: demo
spec:
  accessModes:
    - ReadWriteOnce          # single pod can read/write
  resources:
    requests:
      storage: 1Gi
  storageClassName: crc-csi-hostpath-provisioner   # Default SC for CRC
---
# ============================================================
# 5. Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: image-registry.openshift-image-registry.svc:5000/demo/demo-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          # --- Environment variables from ConfigMap and Secret ---
          envFrom:
            - configMapRef:
                name: demo-app-config
            - secretRef:
                name: demo-app-secret

          # --- Downward API: Inject pod metadata as env vars ---
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # --- PVC mount ---
          volumeMounts:
            - name: app-storage
              mountPath: /data/app

          # --- Health probes ---
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: demo-app-pvc

      # No imagePullSecrets needed for OpenShift Internal Registry
      # (builder SA in the same namespace is already authorized)
---
# ============================================================
# 6. Service — Exposes pods within the cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# ============================================================
# 7. Route — HTTP access from outside (OpenShift-specific)
# ============================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo-app
  namespace: demo
spec:
  host: demo-app-demo.apps-crc.testing
  to:
    kind: Service
    name: demo-app
  port:
    targetPort: http
  tls:
    termination: edge          # TLS ends here, pod receives plain HTTP
    insecureEdgeTerminationPolicy: Redirect
