# ============================================================
# 1. Namespace (Project)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# ============================================================
# 2. ConfigMap — Application configuration (non-sensitive)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-demo-git-config
  namespace: demo
data:
  APP_ENV: "production"
  APP_COLOR: "blue"
  APP_MESSAGE: "Hello OpenShift CRC! 🚀"
  APP_VERSION: "v1.1.0"
  ROUTE_URL: "http://openshift-demo-git-demo.apps-crc.testing"
---
# ============================================================
# 3. Secret — Sensitive data (base64 encoded)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: openshift-demo-git-secret
  namespace: demo
type: Opaque
data:
  DB_USER: YWRtaW51c2Vy
  DB_PASSWORD: UzNjdXIzUEBzcyE=
  API_KEY: bXlhcGlrZXkxMjM=
---
# ============================================================
# 4. PersistentVolumeClaim — Dynamic storage request
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openshift-demo-git-pvc
  namespace: demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: crc-csi-hostpath-provisioner
---
# ============================================================
# 5. Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-demo-git
  namespace: demo
  labels:
    app: openshift-demo-git
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-demo-git
  template:
    metadata:
      labels:
        app: openshift-demo-git
    spec:
      containers:
      - name: openshift-demo-git
        image: image-registry.openshift-image-registry.svc:5000/demo/openshift-demo-git:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: openshift-demo-git-config
        - secretRef:
            name: openshift-demo-git-secret
        volumeMounts:
        - name: storage-volume
          mountPath: /data/app
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: openshift-demo-git-pvc
---
# ============================================================
# 6. Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: openshift-demo-git
  namespace: demo
spec:
  selector:
    app: openshift-demo-git
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
# ============================================================
# 7. Route (External Access)
# ============================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openshift-demo-git
  namespace: demo
spec:
  host: openshift-demo-git-demo.apps-crc.testing
  to:
    kind: Service
    name: openshift-demo-git
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
